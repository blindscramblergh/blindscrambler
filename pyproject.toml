[project]
name = "blindscrambler"
version = "0.1.15"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "blindscramblergh", email = "blindscrambler@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.7.1",
    "manim>=0.19.2",
    "matplotlib>=3.10.6",
    "numpy>=2.3.3",
    "onnx>=1.19.1",
    "onnxruntime>=1.24.4",
    "pandas>=3.0.0",
    "polars>=1.34.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "torch[cuda-12]>=2.0.0",
    "torchaudio>=2.8.0",
    "torcheval>=0.0.7",
    "torchvision>=0.23.0",
    "twine>=6.1.0",
]

[tool.maturin]
module-name = "blindscrambler._core"
python-packages = ["blindscrambler"]
python-source = "src"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
